name: 更新活動狀態
on:
  schedule:
    - cron: '0 1,3,5,7,9,11,13,15 * * *'  # UTC、對應台灣 09/11/13/15/17/19/21/23
    # 月初重設班:UTC 16:05 = 台灣次日 00:05。
    # 用途是消除每月 1 號 00:00-09:00 的空窗——原本首班在台灣 09:00,但 app 端的
    # 通知節流 key 一過 00:00 就翻頁成新月份,這 9 小時內線上 JSON 仍是上個月終態
    # (flag 全 true、文案全寫上個月),上個月已發過的額滿通知會被整批重發一次。
    # needReset 需要 todayStr/getDate() 是台灣時間才會在 1 號觸發,靠下方
    # 「執行額滿檢查」step 的 TZ: Asia/Taipei;GitHub Actions 的 cron 恆為 UTC,
    # 不受該環境變數影響,兩者互不干涉。
    # 每天跑而非每月 1 號:台灣 1 號 00:05 對應的 UTC 是「上個月最後一天 16:05」,
    # 日期隨月份長度變動(28/29/30/31),cron 無法固定表達,故每日一班。
    - cron: '5 16 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install puppeteer
        run: npm install puppeteer pdf-parse
      - name: 執行額滿檢查
        run: node scripts/check-promo.js
        env:
          TZ: Asia/Taipei
      - name: 檢查是否有變更
        id: check_changes
        run: |
          if git diff --quiet promo_status.json 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: 提交變更
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add promo_status.json
          git commit -m "更新活動額滿狀態 $(date +%Y-%m-%d_%H:%M)"
          git push
